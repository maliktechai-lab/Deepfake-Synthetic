# Preprocessing Configuration for EXP-S01
# 
# This configuration controls the face detection, alignment, and crop generation pipeline.
# All parameters are versioned and recorded in the output manifest.

# Output configuration
target_size: [224, 224]
output_format: "jpg"
output_quality: 95

# Face detection (MTCNN via facenet-pytorch)
face_detector: "mtcnn"
min_face_size: 20
min_confidence: 0.9
select_largest: true

# Bounding box expansion
# margin=0.2 means 20% expansion on EACH SIDE (left/right, top/bottom)
# A 100x100 face box becomes 140x140 after expansion
bbox_margin: 0.2

# Landmark alignment
align_method: "similarity"
# Canonical 5-point landmark template for 224x224 output
# Order: left_eye, right_eye, nose, left_mouth, right_mouth
canonical_landmarks:
  - [84.0, 84.0]
  - [140.0, 84.0]
  - [112.0, 120.0]
  - [84.0, 156.0]
  - [140.0, 156.0]

# Quality thresholds
min_blur_score: 50.0          # Minimum Laplacian variance (sharpness)
min_face_size_pixels: 1000    # Minimum face area in source image

# Video processing
frame_interval: 1             # Process every N frames
max_frames_per_video: null    # null = process all frames

# Versioning
version: "1.0"
detector_version: "mtcnn-facenet-pytorch-2.5.3"